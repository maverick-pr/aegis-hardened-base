  # ── distroless gcc-12 / libgcc / libstdc++ — all "(won't fix)" ──────────────
  # Matching by fix-state rather than package name to avoid YAML special-char
  # issues with "libstdc++6". These CVEs are tagged "(won't fix)" by Debian
  # upstream; no patch will be backported to the gcc-12 line in distroless.
  - vulnerability: CVE-2026-95619
    fix-state: "wont-fix"
  - vulnerability: CVE-2026-102010
    fix-state: "wont-fix"
  - vulnerability: CVE-2022-27943

  # ── Python CVEs with no 3.13.x backport ─────────────────────────────────────
  # These CVEs are fixed only in Python 3.15.x pre-releases (alpha/rc).
  # No patch has been backported to the 3.13 series by the Python Security Team.
  # Accepted until a 3.13.x fix ships. Re-evaluate on each quarterly repine.
  - vulnerability: CVE-2025-15367
    package:
      name: python
      type: binary
  - vulnerability: CVE-2026-12345
    package:
      name: python
      type: binary
