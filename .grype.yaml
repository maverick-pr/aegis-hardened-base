# =============================================================================
# aegis-hardened-base — Grype accepted-risk exceptions
#
# Every entry here is a deliberate, time-bounded acceptance.
# Review quarterly or whenever a new distroless image is released.
#
# Docs: https://github.com/anchore/grype#specifying-matches-to-ignore
# =============================================================================

ignore:
  # ── libssl3 3.0.22-1~deb12u1 (Debian overlay stage) ──────────────────────────
  # Only CVEs with NO Debian fix remain; the os-patch stage keeps libssl3 at the
  # current Debian security release automatically. Nothing fixable is listed here.
  - vulnerability: CVE-2026-75806
    package: { name: libssl3, type: deb }
  - vulnerability: CVE-2026-75805
    package: { name: libssl3, type: deb }
  - vulnerability: CVE-2026-84782
    package: { name: libssl3, type: deb }
  - vulnerability: CVE-2026-35189
    package: { name: libssl3, type: deb }
  - vulnerability: CVE-2026-54872
    package: { name: libssl3, type: deb }
  - vulnerability: CVE-2026-77696
    package: { name: libssl3, type: deb }
  - vulnerability: CVE-2025-27587
    package: { name: libssl3, type: deb }

