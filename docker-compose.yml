# =============================================================================
# AegisRange hardened base — runtime security profile
#
# Every option here mirrors a CIS Docker Benchmark control or a regulated-sector
# audit requirement. The comments explain which control each setting satisfies.
#
# Usage:
#   docker compose up             # start with full security profile
#   docker compose run --rm app   # one-off command
# =============================================================================

services:
  app:
    image: aegis-hardened-base:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "${BUILD_DATE:-}"
        GIT_COMMIT: "${GIT_COMMIT:-}"

    # ── Identity ─────────────────────────────────────────────────────────────
    # CIS 4.1 — do not run as root
    # distroless/cc-debian12:nonroot pre-defines UID/GID 65532 ("nonroot")
    user: "65532:65532"

    # ── Filesystem ───────────────────────────────────────────────────────────
    # CIS 5.12 — mount container's root filesystem as read-only.
    # App writes go to named volumes or /tmp (mapped below).
    read_only: true

    tmpfs:
      # /tmp — writable scratch space; nosuid, noexec, nodev harden it
      - /tmp:size=256m,mode=1777,uid=65532,gid=65532,noexec,nosuid,nodev
      # /tmp/app — app-specific temp, separate from OS /tmp
      - /tmp/app:size=512m,mode=750,uid=65532,gid=65532,noexec,nosuid,nodev

    volumes:
      # Named volume for persistent application data — never host-mount
      # a directory that contains secrets or OS files.
      - app-data:/app/data

    # ── Capabilities ─────────────────────────────────────────────────────────
    # CIS 5.3 — drop all capabilities, add back only what the app genuinely needs.
    # Most AI inference and API services need NONE of the defaults.
    cap_drop:
      - ALL
    # cap_add:                    # uncomment only with documented justification
    #   - NET_BIND_SERVICE        # only if binding port < 1024

    # ── Privilege escalation ─────────────────────────────────────────────────
    # CIS 5.4 — prevent setuid binaries from granting extra privileges
    # The container shares the HOST kernel; the image cannot harden it. These are the
    # kernel-facing controls: seccomp filters the syscalls the workload may issue,
    # AppArmor confines file/capability/mount access.
    # Never set `seccomp:unconfined` — it disables syscall filtering entirely.
    security_opt:
      - no-new-privileges:true
      - seccomp:seccomp-profile.json   # Docker default allow-list minus escape/debug primitives
      - apparmor:docker-default

    # ── Resource limits ──────────────────────────────────────────────────────
    # Prevent resource exhaustion (DoS) and contain blast radius
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4G"
          pids: 512        # CIS 5.28 — limit PIDs to prevent fork bombs
        reservations:
          cpus: "0.25"
          memory: "256M"

    # ── Network ──────────────────────────────────────────────────────────────
    # Attach only to the internal network; no external exposure by default.
    # Add a 'ports:' mapping in an overlay compose file for the specific port
    # your service needs, rather than opening ports here in the base.
    networks:
      - internal

    # ── Logging ──────────────────────────────────────────────────────────────
    # CIS 5.25 — restrict container log size to prevent disk exhaustion
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        # In regulated environments replace with a centralised logging driver:
        # driver: fluentd  /  driver: awslogs  /  driver: splunk

    # ── Health ───────────────────────────────────────────────────────────────
    healthcheck:
      test: ["/opt/python/bin/python3", "-c", "import sys; sys.exit(0 if sys.version_info >= (3,13) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ── Signals ──────────────────────────────────────────────────────────────
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped

    environment:
      # Never embed secrets here — use Docker secrets or a Vault-backed secret store
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      NODE_ENV: "production"
      TZ: "UTC"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true          # no outbound internet access from this network by default
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"   # inter-container comms off
      com.docker.network.bridge.enable_ip_masquerade: "false"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  app-data:
    driver: local
    driver_opts:
      type: none
      o: "uid=65532,gid=65532,mode=750"
      device: "${PWD}/data"
